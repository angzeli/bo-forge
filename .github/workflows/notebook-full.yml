name: Manual full notebook assurance

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_HTTP_TIMEOUT: "300"

jobs:
  source:
    name: Build one source archive
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install constrained build environment
        run: |
          python -m pip install "uv==0.11.3"
          uv pip install --system --require-hashes --torch-backend cpu \
            -r requirements/constraints-py312-linux-x86_64.txt
          python -m pip check
      - name: Build source archive once
        run: python -m build --sdist --no-isolation --outdir "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: notebook-source
          path: ${{ runner.temp }}/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  notebooks:
    needs: source
    uses: ./.github/workflows/notebook-execution.yml
    with:
      profile: full
      artifact-name: notebook-source
      source-ref: ${{ github.sha }}
