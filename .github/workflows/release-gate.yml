name: Future tag release gate

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Existing v* tag to validate
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_REF: ${{ github.event_name == 'push' && github.ref_name || inputs.ref }}
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  UV_HTTP_TIMEOUT: "300"

jobs:
  validate-tag:
    name: Validate exact tag and build artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: release-uv-${{ runner.os }}-${{ hashFiles('requirements/constraints-py312-linux-x86_64.txt') }}
      - name: Verify tag and package version
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_REF"]
          if re.fullmatch(r"v\d+\.\d+\.\d+", tag) is None:
              raise SystemExit(f"Release ref must be an existing vX.Y.Z tag: {tag}")
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag} does not match package version {version}")
          exact_tags = subprocess.check_output(
              ["git", "tag", "--points-at", "HEAD"], text=True
          ).splitlines()
          if tag not in exact_tags:
              raise SystemExit(f"Checked-out commit is not exactly tagged {tag}")
          PY
      - name: Install constrained release environment
        run: |
          python -m pip install "uv==0.11.3"
          uv pip install --system --require-hashes --torch-backend cpu \
            -r requirements/constraints-py312-linux-x86_64.txt
          uv pip install --system --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Required tests and lint
        run: |
          ruff check . --no-cache
          python -m pytest -p no:cacheprovider
      - name: Build exact-tag artifacts
        run: python -m build --outdir "$RUNNER_TEMP/dist"
      - name: Verify exact-tag artifacts
        env:
          DIST_DIR: ${{ runner.temp }}/dist
        run: |
          python -m twine check "$DIST_DIR"/*
          python - <<'PY'
          import os
          from pathlib import Path
          from tests._release_readiness_support import (
              _assert_sdist_contains_release_assets,
              _assert_wheel_package_boundaries,
          )

          dist = Path(os.environ["DIST_DIR"])
          wheel, = dist.glob("*.whl")
          sdist, = dist.glob("*.tar.gz")
          _assert_wheel_package_boundaries(wheel)
          _assert_sdist_contains_release_assets(sdist)
          PY
      - name: External core and optional interface smokes
        shell: bash
        run: |
          set -euo pipefail
          wheels=("$RUNNER_TEMP/dist"/*.whl)
          sdists=("$RUNNER_TEMP/dist"/*.tar.gz)
          [[ ${#wheels[@]} -eq 1 && -f ${wheels[0]} ]] || { echo "Expected exactly one wheel" >&2; exit 1; }
          [[ ${#sdists[@]} -eq 1 && -f ${sdists[0]} ]] || { echo "Expected exactly one sdist" >&2; exit 1; }
          wheel=${wheels[0]}
          sdist=${sdists[0]}

          python -m venv "$RUNNER_TEMP/core-probe"
          uv pip install --python "$RUNNER_TEMP/core-probe/bin/python" \
            --torch-backend cpu \
            -c requirements/constraints-py312-linux-x86_64.txt "$wheel"
          "$RUNNER_TEMP/core-probe/bin/python" -m pip check
          "$RUNNER_TEMP/core-probe/bin/python" -c \
            'import importlib.util; assert importlib.util.find_spec("streamlit") is None; assert importlib.util.find_spec("fastapi") is None'
          (cd "$RUNNER_TEMP" && PYTHONPATH= \
            "$RUNNER_TEMP/core-probe/bin/bo-forge" --version)
          (cd "$RUNNER_TEMP" && PYTHONPATH= SOURCE_ROOT="$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/core-probe/bin/python" -c \
              'import os; from pathlib import Path; import bo_forge; module = Path(bo_forge.__file__).resolve(); source = Path(os.environ["SOURCE_ROOT"]).resolve(); assert source not in module.parents, module')

          python -m venv "$RUNNER_TEMP/sdist-probe"
          uv pip install --python "$RUNNER_TEMP/sdist-probe/bin/python" \
            --torch-backend cpu \
            -c requirements/constraints-py312-linux-x86_64.txt "$sdist"
          "$RUNNER_TEMP/sdist-probe/bin/python" -m pip check
          (cd "$RUNNER_TEMP" && PYTHONPATH= \
            "$RUNNER_TEMP/sdist-probe/bin/bo-forge" --version)

          python -m venv "$RUNNER_TEMP/app-probe"
          uv pip install --python "$RUNNER_TEMP/app-probe/bin/python" \
            --torch-backend cpu \
            -c requirements/constraints-py312-linux-x86_64.txt "${wheel}[app]"
          "$RUNNER_TEMP/app-probe/bin/python" -m pip check
          "$RUNNER_TEMP/app-probe/bin/python" -c \
            'import importlib.util; assert importlib.util.find_spec("streamlit") is not None; assert importlib.util.find_spec("fastapi") is None'
          (cd "$RUNNER_TEMP" && PYTHONPATH= \
            "$RUNNER_TEMP/app-probe/bin/bo-forge-app" --help)

          python -m venv "$RUNNER_TEMP/api-probe"
          uv pip install --python "$RUNNER_TEMP/api-probe/bin/python" \
            --torch-backend cpu \
            -c requirements/constraints-py312-linux-x86_64.txt "${wheel}[api]"
          "$RUNNER_TEMP/api-probe/bin/python" -m pip check
          "$RUNNER_TEMP/api-probe/bin/python" -c \
            'import importlib.util; assert importlib.util.find_spec("fastapi") is not None; assert importlib.util.find_spec("streamlit") is None'
          (cd "$RUNNER_TEMP" && PYTHONPATH= \
            "$RUNNER_TEMP/api-probe/bin/bo-forge-api" --help)
          (cd "$RUNNER_TEMP" && PYTHONPATH= \
            "$RUNNER_TEMP/api-probe/bin/python" -c \
              'from pathlib import Path; import bo_forge_api; from bo_forge_api.api import create_app; assert not hasattr(bo_forge_api, "create_app"); app = create_app(root=Path(".")); assert app.title')
      - name: Retain verified artifacts for manual release preparation
        uses: actions/upload-artifact@v4
        with:
          name: bo-forge-${{ env.RELEASE_REF }}-verified
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 14
