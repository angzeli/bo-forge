campaign_name: discrete_batch_multi_fidelity_qmfkg
objective:
  name: activity
  direction: maximize
variables:
  - name: catalyst_loading
    type: continuous
    lower: 0.05
    upper: 0.50
  - name: reaction_temperature
    type: continuous
    lower: 40.0
    upper: 120.0
  - name: fidelity
    type: continuous
    lower: 0.25
    upper: 1.00
fidelity:
  variable: fidelity
  target: 1.0
  levels: [0.25, 0.50, 0.75, 1.00]
  fixed_cost: 0.01
  fidelity_cost_weight: 1.0
  num_fantasies: 8
bo:
  batch_size: 2
  initial_design_size: 6
  acquisition: qmf_kg
  initial_design_method: sobol
  random_seed: 22
  raw_samples: 8
  num_restarts: 1
  mc_samples: 16
  min_normalized_distance: 0.0
